[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "onapp2vhi"
dynamic = ["version"]
readme = "README.md"
authors = [
    { name = "Virtuozzo", email = "onapp2vhi@virtuozzo.com" },
]
description = "onapp to vhi migration tool"
dependencies = [
    "click==7.1.2",
    "colorlog==4.8.0",
    "paramiko==3.1.0",
    "requests==2.27.1",
    "regex==2023.8.8",
    "importlib-resources==1.4.0",
]

[project.urls]
Documentation = "https://bitbucket.org/onappcore/onapp2vhi/src/master/README.md"
Source = "https://bitbucket.org/onappcore/onapp2vhi/src/master/"
Changelog = "https://bitbucket.org/onappcore/onapp2vhi/src/master/CHANGELOG.md"

[project.scripts]
onapp2vhi = "onapp2vhi.main:run"

